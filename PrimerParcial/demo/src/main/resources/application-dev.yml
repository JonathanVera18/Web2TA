spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/AutonomoWeb
    username: postgres
    password: 1234

logging:
  level:
    com.example.demo: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: "*"